workflows:
  ios-testflight:
    name: CoptC iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: CoptC
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: tr.deadella.coptc
      vars:
        BUNDLE_ID: tr.deadella.coptc
        XCODE_SCHEME: CoptC
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          cd ios
          xcodegen generate
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build and export IPA
        script: |
          cd ios
          xcodebuild -project CoptC.xcodeproj \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/CoptC.xcarchive \
            archive \
            CODE_SIGN_STYLE=Manual
          xcodebuild -exportArchive \
            -archivePath build/CoptC.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist "$CM_EXPORT_OPTIONS"
    artifacts:
      - ios/build/ipa/*.ipa
      - ios/build/CoptC.xcarchive
    publishing:
      email:
        recipients:
          - cekadisticaret@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
