workflows:
  ios-testflight:
    name: CoptC iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: CoptC
    environment:
      groups:
        - ios_signing
      vars:
        BUNDLE_ID: tr.deadella.coptc
        XCODE_SCHEME: CoptC
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          cd ios
          BUILD_VER="$(date +%s)"
          echo "CFBundleVersion=$BUILD_VER"
          sed -i '' "s/CURRENT_PROJECT_VERSION: \".*\"/CURRENT_PROJECT_VERSION: \"${BUILD_VER}\"/" project.yml
          xcodegen generate
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build and export IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/ios/CoptC.xcodeproj" \
            --scheme "$XCODE_SCHEME"
      - name: Upload to TestFlight
        script: |
          IPA=$(find "$CM_BUILD_DIR" -name "*.ipa" | head -1)
          echo "IPA: $IPA"
          app-store-connect publish --path "$IPA"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - cekadisticaret@gmail.com
        notify:
          success: true
          failure: true
